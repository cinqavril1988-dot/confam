<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#21060b"/><stop offset=".5" stop-color="#10070c"/><stop offset="1" stop-color="#03040a"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#f12739" stop-opacity=".75"/><stop offset="1" stop-color="#b80b20" stop-opacity="0"/></radialGradient>
 <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b86d43"/><stop offset="1" stop-color="#4b241e"/></linearGradient>
 <linearGradient id="shirt"><stop stop-color="#24222b"/><stop offset="1" stop-color="#07080d"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="45"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<ellipse cx="1160" cy="350" rx="520" ry="470" fill="url(#glow)" filter="url(#blur)" opacity=".65"/>
<g opacity=".45" fill="#ff3048" filter="url(#blur)"><path d="M980 40L1400 120 1170 510 900 300Z"/><path d="M1300 500L1600 200 1550 700Z"/></g>
<!-- crowd silhouette -->
<g fill="#07060a" opacity=".98"><path d="M0 900V720q80-85 150 10l80 170Z"/><path d="M150 900V760q-30-85 20-110 55 35 45 100l90 150Z"/><path d="M350 900V740q30-75 75-35l30 100 80 95Z"/><path d="M540 900V780q55-85 100-30l70 150Z"/><path d="M790 900V740q40-90 90-30l70 190Z"/><path d="M1080 900V760q55-80 100-25l50 165Z"/></g>
<!-- performer shoulder and torso -->
<path d="M690 900q30-210 160-275 110-40 190 20 170 95 230 235Z" fill="url(#shirt)"/>
<!-- neck -->
<path d="M1050 420l10 115q65 55 120-20l-35-160Z" fill="url(#skin)"/>
<!-- head -->
<path d="M940 190q80-100 210-30 100 70 70 210-20 130-140 160-130-10-170-130-50-130 10-210Z" fill="url(#skin)"/>
<!-- cap -->
<path d="M900 220q-20-130 130-170 160 10 180 110l-30 90q-130-80-270-20Z" fill="#08090e"/><path d="M900 245q190-60 350 15l-65 35q-150-40-270 10Z" fill="#17151c"/>
<!-- sunglasses -->
<g fill="#06070b" stroke="#2c2020" stroke-width="12"><path d="M950 310q80-40 130 5l-15 70q-80 20-110-10Z"/><path d="M1100 315q85-35 130 10l-10 70q-90 15-115-15Z"/></g>
<!-- mouth shouting -->
<path d="M1015 440q80-25 145 15-20 85-85 75-65-25-60-90Z" fill="#21070a"/><path d="M1035 465q65-15 110 10l-15 24-80 5Z" fill="#e9d2c1"/>
<!-- arm up with mic -->
<path d="M900 610q-120-160-160-230-55-90 20-115 60-40 120 35l200 230q-70 100-200 45Z" fill="url(#skin)"/>
<!-- microphone -->
<g transform="rotate(-27 850 330)"><rect x="820" y="290" width="280" height="42" rx="20" fill="#080a10"/><rect x="1020" y="274" width="100" height="75" rx="28" fill="#11131a"/><g stroke="#393b44" stroke-width="6"><path d="M1035 285v52M1050 280v65M1065 280v65M1080 285v52"/></g></g>
<!-- red beams -->
<path d="M1200 0h130l-600 900H650Z" fill="#ff1b3c" opacity=".1"/><path d="M1500 0h100L980 900h-130Z" fill="#ff344c" opacity=".07"/>
<rect width="1600" height="900" fill="url(#bg)" opacity=".30"/>
</svg>